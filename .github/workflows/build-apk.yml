name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json sw.js css js icons android/app/src/main/assets/

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/Rathore-Tracker-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rathore-Tracker-APK
          path: build-output/Rathore-Tracker-v1.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Rathore Money Tracker APK v1.0.0"
          body: |
            ### 📱 Rathore Money Tracker Android APK
            Install directly on any Android device!

            - **App Name:** Rathore Tracker
            - **Version:** 1.0.0
            - **Storage:** 100% Offline & On-Device
            - **Features:** UPI / Cash / Card tracking, charts, monthly budget & Excel export.
            - **Shareable:** You can send this `.apk` file directly on WhatsApp or Telegram to friends.
          files: build-output/Rathore-Tracker-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
